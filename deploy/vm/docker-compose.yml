# Runs on the Google Cloud VM (see ../../docs/DEPLOYMENT.md). Two containers: the API, and Caddy which gets and renews the HTTPS certificate.
name: ojaloom
services:
  app:
    build:
      context: ./backend
    image: ojaloom-api:local
    restart: unless-stopped
    env_file: /etc/ojaloom/env            # root-only file written at boot from instance metadata + Secret Manager
    volumes:
      - /mnt/disks/ojaloom-data:/data     # the persistent disk that holds the database
    expose:
      - "8000"                            # reachable only by Caddy, never published to the internet
    read_only: true                       # the container cannot change its own files
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s                # lets Litestream flush the last changes on shutdown
    logging:
      driver: gcplogs                     # straight into Cloud Logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    env_file: /etc/ojaloom/caddy.env      # only API_DOMAIN: Caddy never sees a secret
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                  # certificates: keep, or Let's Encrypt rate limits bite on re-issue
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: gcplogs

volumes:
  caddy_data:
  caddy_config:
