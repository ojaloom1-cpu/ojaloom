# Keeps the pinned GitHub Actions (and the test tooling) up to date by opening pull requests you review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
